name: Apply reschedule slot cutoff fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'sunkarasivaprasad6-byte'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch rescheduling logic
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/my-subscription/page.tsx')
          text = path.read_text()

          old_import = 'import { isSlotChangeLocked } from "@/lib/deliverySlotRules";'
          new_import = 'import { isSlotChangeLocked, isSlotEligibleForNewSubscription } from "@/lib/deliverySlotRules";'
          if old_import in text:
              text = text.replace(old_import, new_import, 1)

          old_validation = 'if (scheduleDate === isoDate() && isSlotChangeLocked(scheduleSlot)) { toast.error("That slot has reached its 30-minute cutoff. Choose another slot or a future date."); return; }'
          new_validation = 'if (scheduleDate === isoDate() && !isSlotEligibleForNewSubscription(scheduleSlot, new Date(), 30)) { toast.error("That slot has already passed or reached its 30-minute cutoff. Choose another slot or a future date."); return; }'
          if old_validation in text:
              text = text.replace(old_validation, new_validation, 1)

          marker = 'scheduleSlot'
          start = text.find(marker)
          if start == -1:
              raise SystemExit('scheduleSlot marker not found')
          map_pos = text.find('DELIVERY_SLOTS.map(', start)
          if map_pos == -1:
              raise SystemExit('schedule slot map not found')
          text = text[:map_pos] + text[map_pos:].replace(
              'DELIVERY_SLOTS.map(',
              'DELIVERY_SLOTS.filter((slot) => scheduleDate !== isoDate() || isSlotEligibleForNewSubscription(slot, new Date(), 30)).map(',
              1,
          )

          path.write_text(text)
          PY

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/my-subscription/page.tsx
          git commit -m "Apply reschedule slot cutoff rules" || exit 0
          git rm .github/workflows/fix-reschedule-slot-cutoff.yml
          git commit --amend --no-edit
          git push
