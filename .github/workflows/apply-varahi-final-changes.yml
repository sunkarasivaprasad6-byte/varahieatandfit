name: Apply Varahi final fixes

on:
  push:
    branches: [main]

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          # Tea benefits must appear for the actual Herbal Tea category.
          p = Path('components/MenuSection.tsx')
          s = p.read_text()
          s = s.replace('(activeCategory === "Tea" || activeCategory === "Soups")', '(activeCategory === "Herbal Tea" || activeCategory === "Tea" || activeCategory === "Soups")')
          s = s.replace('{activeCategory === "Tea"\n                ? "Traditional/general wellness benefits associated with these teas and ingredients."', '{activeCategory === "Herbal Tea" || activeCategory === "Tea"\n                ? "Traditional/general wellness benefits associated with these teas and ingredients."')
          s = s.replace('(activeCategory === "Tea" ? TEA_BENEFITS : SOUP_BENEFITS)', '(activeCategory === "Herbal Tea" || activeCategory === "Tea" ? TEA_BENEFITS : SOUP_BENEFITS)')
          p.write_text(s)

          # Required plan-ending wording.
          p = Path('app/my-subscription/page.tsx')
          s = p.read_text().replace('<p className="text-xs text-white/35">Plan ends</p><p className="mt-1 text-sm">{endDays} days</p>', '<p className="text-xs text-white/35">Plan ending</p><p className="mt-1 text-sm">PLAN ENDS IN {endDays} DAYS</p>')
          p.write_text(s)

          # Admin delivery rows use the customer's per-day customization and
          # never replace the customer's stored start date during confirmation.
          p = Path('app/admin/operations/page.tsx')
          s = p.read_text()
          s = s.replace('import { getFirstDeliveryDate, getSubscriptionEndDate } from "@/lib/subscriptionScheduling";', 'import { getSubscriptionEndDate } from "@/lib/subscriptionScheduling";')
          s = s.replace('const meal=getPlan(s.planId)?.meals[day.toLowerCase()];return{id:`sub:${s.id}:${date}`', 'const meal=getPlan(s.planId)?.meals[day.toLowerCase()];const custom=(s.mealCustomizations||{})[day];return{id:`sub:${s.id}:${date}`')
          s = s.replace('protein:s.proteinPerMeal,instructions:s.instructions,time:s.deliverySlot', 'protein:custom?.protein ?? s.proteinPerMeal,instructions:s.instructions,time:s.deliverySlot', 1)
          s = s.replace('const m=getPlan(s.planId)?.meals[day.toLowerCase()];if(statusMap(s)[date]', 'const m=getPlan(s.planId)?.meals[day.toLowerCase()];const custom=(s.mealCustomizations||{})[day];if(statusMap(s)[date]')
          s = s.replace('protein:s.proteinPerMeal,instructions:s.instructions,time:s.deliverySlot||s.deliveryTime,address:s.address,status:"DELIVERED"', 'protein:custom?.protein ?? s.proteinPerMeal,instructions:s.instructions,time:s.deliverySlot||s.deliveryTime,address:s.address,status:"DELIVERED"', 1)
          old='async function confirmSubscription(item:Subscription){if(!item.id)return;setLoading(true);setMessage("");try{const confirmationTime=new Date();const slot=item.deliverySlot||item.deliveryTime||"";const firstDelivery=getFirstDeliveryDate(confirmationTime,slot);const end=getSubscriptionEndDate(firstDelivery);await updateSubscription(item.id,{status:"ACTIVE",paymentStatus:"SUCCESS",paymentVerifiedAt:confirmationTime.toISOString(),startDate:firstDelivery.toISOString(),endDate:end.toISOString()});'
          new='async function confirmSubscription(item:Subscription){if(!item.id)return;setLoading(true);setMessage("");try{const confirmationTime=new Date();const firstDelivery=item.startDate?new Date(item.startDate):confirmationTime;const end=item.endDate?new Date(item.endDate):getSubscriptionEndDate(firstDelivery);await updateSubscription(item.id,{status:"ACTIVE",paymentStatus:"SUCCESS",paymentVerifiedAt:confirmationTime.toISOString(),startDate:firstDelivery.toISOString(),endDate:end.toISOString()});'
          s = s.replace(old, new)
          marker='<p className="text-xs text-white/35">Delivery</p><p className="mt-1">{x.deliverySlot||x.deliveryTime}</p><p className="text-xs text-white/40">{x.address||"No address"}</p>'
          replacement=marker+'{x.upiTransactionId&&<p className="mt-3 rounded-xl border border-blue-500/20 bg-blue-500/10 p-3 text-xs"><span className="font-bold text-blue-300">UPI Transaction ID / UTR:</span> <span className="font-mono text-white">{x.upiTransactionId}</span></p>}'
          s=s.replace(marker,replacement)
          p.write_text(s)

          # Remove this one-shot workflow after applying the changes.
          Path('.github/workflows/apply-varahi-final-changes.yml').unlink()
      - name: Commit final fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply final Varahi menu and subscription fixes"
          git push
