name: Apply Varahi location validation fix
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch location validation
        shell: python
        run: |
          from pathlib import Path
          p=Path('components/checkout/PlaceOrderButton.tsx')
          s=p.read_text()
          s=s.replace('if (!addressValid) {\n      toast.error("Please enter your complete delivery address.");', 'if (!addressValid && !location) {\n      toast.error("Please enter your complete delivery address or detect your location.");')
          p.write_text(s)
          p=Path('app/checkout/page.tsx')
          s=p.read_text()
          s=s.replace('const addressValid = address.trim().length >= 20;', 'const addressValid = address.trim().length >= 10 || location.trim().length > 0;')
          s=s.replace('setLocation(`https://maps.google.com/?q=${position.coords.latitude},${position.coords.longitude}`);\n        setLoadingLocation(false);', 'const detected = `https://maps.google.com/?q=${position.coords.latitude},${position.coords.longitude}`;\n        setLocation(detected);\n        setAddress(detected);\n        setLoadingLocation(false);')
          p.write_text(s)
          p=Path('app/api/orders/guest/route.ts')
          s=p.read_text().replace('const address = String(body.address || "").trim();', 'const address = String(body.address || body.location || "").trim();').replace('if (address.length < 20) {', 'if (address.length < 10) {')
          p.write_text(s)
          Path('.github/workflows/apply-location-fix.yml').unlink()
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Allow detected location without manual address"
          git push
