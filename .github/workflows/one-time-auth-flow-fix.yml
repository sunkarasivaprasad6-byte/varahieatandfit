name: One-time auth flow fix

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const checkoutPath = 'app/subscriptions/checkout/page.tsx';
            let checkout = fs.readFileSync(checkoutPath, 'utf8');
            const start = checkout.indexOf(' async function submitPayment()');
            const end = checkout.indexOf('\n const isMap=', start);
            if (start < 0 || end < 0) throw new Error('checkout submitPayment marker not found');
            const replacement = ` async function submitPayment(){
            if(!validate())return;
            const currentUser=auth.currentUser;
            if(!currentUser){
              saveDraft(5);
              window.location.href=\`/account?signup=1&returnTo=\${encodeURIComponent(\`/subscriptions/checkout?plan=\${plan.id}\`)}\`;
              return;
            }
            setLoading(true);
            try{
              const selected=slots.find(x=>x.slot===regularSlot);
              if(!selected?.available)throw new Error("That delivery slot is now full. Please choose another slot.");
              const idToken=await currentUser.getIdToken(true);
              const response=await fetch("/api/subscriptions/guest",{method:"POST",headers:{"Content-Type":"application/json",Authorization:\`Bearer \${idToken}\`},body:JSON.stringify({name:name.trim(),phone,address,location:address.startsWith("https://www.google.com/maps?q=")?address:"",slot:regularSlot,regularSlot,firstDeliverySlotOverride:firstDeliverySlotOverride||"",firstDeliveryOverrideDate:firstDeliverySlotOverride&&isToday(startDate)?startDate:"",protein:selectedProtein,mealCustomizations,instructions,planId:plan.id,day,startDate:startDate||dateString(),upiTransactionId:upiTransactionId.trim()})});
              const data=await response.json().catch(()=>({}));
              if(!response.ok)throw new Error(data?.error||"Unable to submit your subscription.");
              const subscriptionId=String(data.subscriptionId||"");
              if(!subscriptionId)throw new Error("Subscription was not created. Please try again.");
              localStorage.removeItem(DRAFT_KEY);
              window.location.href=\`/subscriptions/payment-verification?id=\${encodeURIComponent(subscriptionId)}&plan=\${encodeURIComponent(plan.id)}\`;
            }catch(error){toast.error(error instanceof Error?error.message:"Unable to submit payment");}
            finally{setLoading(false);}
          }`;
            checkout = checkout.slice(0, start) + replacement + checkout.slice(end);
            fs.writeFileSync(checkoutPath, checkout);

            const accountPath = 'app/account/page.tsx';
            let account = fs.readFileSync(accountPath, 'utf8');
            const oldAccount = '    const value = params.get("returnTo");\n    const pendingId = params.get("subscriptionId") || localStorage.getItem("varahi-pending-subscription-id") || "";';
            const newAccount = '    const value = params.get("returnTo");\n    const signupRequested = params.get("signup") === "1";\n    if (signupRequested) setMode("signup");\n    const pendingId = params.get("subscriptionId") || localStorage.getItem("varahi-pending-subscription-id") || "";';
            if (!account.includes(oldAccount)) throw new Error('account marker not found');
            fs.writeFileSync(accountPath, account.replace(oldAccount, newAccount));

            const verificationPath = 'app/subscriptions/payment-verification/page.tsx';
            let verification = fs.readFileSync(verificationPath, 'utf8');
            const oldVerification = '<Link href="/account" className="rounded-full bg-[#E63946] px-7 py-3 text-sm font-bold">View My Subscription</Link>';
            const newVerification = '<Link href="/my-subscription" className="rounded-full bg-[#E63946] px-7 py-3 text-sm font-bold">View My Subscription</Link>';
            if (!verification.includes(oldVerification)) throw new Error('verification marker not found');
            fs.writeFileSync(verificationPath, verification.replace(oldVerification, newVerification));

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/subscriptions/checkout/page.tsx app/account/page.tsx app/subscriptions/payment-verification/page.tsx
          git commit -m "fix: require account before subscription submission" || exit 0
          git push